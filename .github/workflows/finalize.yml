name: Finalize localized build

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply local only fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import re

          runtime = base64.b64decode("").decode("utf-8")
          readme = base64.b64decode("").decode("utf-8")

          root = Path(".")
          offline = root / "__sitecloner"
          offline.mkdir(exist_ok=True)
          (offline / "runtime.js").write_text(runtime, encoding="utf-8")
          (offline / "blocked").write_bytes(b"")

          index = root / "index.html"
          html = index.read_text(encoding="utf-8")
          html = re.sub(
              r'<script[^>]+src=["\']https://static\.cloudflareinsights\.com/[^"\']+["\'][^>]*></script>',
              "",
              html,
              flags=re.I,
          )
          if "/__sitecloner/runtime.js" not in html:
              html = html.replace("<head>", '<head><script src="/__sitecloner/runtime.js"></script>', 1)

          html = html.replace("/index.htmlicon-512.png", "/icon-512.png")
          html = html.replace("/index.htmlog-image.jpg", "/og-image.jpg")
          index.write_text(html, encoding="utf-8")

          (root / "README.md").write_text(readme, encoding="utf-8")

          workflow = root / ".github" / "workflows" / "finalize.yml"
          workflow.unlink(missing_ok=True)
          try:
              workflow.parent.rmdir()
              workflow.parent.parent.rmdir()
          except OSError:
              pass
          PY
      - name: Audit local dependencies
        shell: bash
        run: |
          node --check __sitecloner/runtime.js
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path(".")
          missing = []

          for js in (root / "assets").glob("*.js"):
              text = js.read_text(encoding="utf-8", errors="ignore")
              for rel in re.findall(r'(?:from|import\()\s*["\'](\./[^"\']+\.js)["\']', text):
                  if not (js.parent / rel).resolve().is_file():
                      missing.append(f"{js}: {rel}")

          html = (root / "index.html").read_text(encoding="utf-8", errors="ignore")
          for attr in ("src", "href"):
              for value in re.findall(fr'{attr}=["\'](/[^"\']+)["\']', html):
                  path = value.split("?", 1)[0].split("#", 1)[0]
                  if not path or path == "/":
                      continue
                  if attr == "href" and Path(path).suffix == "":
                      continue
                  if not (root / path.lstrip("/")).is_file():
                      missing.append(f"index {attr}: {path}")

          for required in [
              "knight.glb",
              "logo.glb",
              "assets/K9zZKQMg.js",
              "img/concept-001-card-400.webp",
              "img/concept-001-card-900.webp",
              "img/concept-002-card-400.webp",
              "img/concept-002-card-900.webp",
              "img/concept-004-card-400.webp",
              "img/concept-004-card-900.webp",
              "img/concept-005-card-400.webp",
              "img/concept-005-card-900.webp",
              "img/concept-007-card-400.webp",
              "img/concept-007-card-900.webp",
              "img/concept-008-card-400.webp",
              "img/concept-008-card-900.webp",
              "icon-512.png",
              "og-image.jpg",
          ]:
              if not (root / required).is_file():
                  missing.append(required)

          if missing:
              raise SystemExit("Missing local dependencies:\n" + "\n".join(sorted(set(missing))))

          if "static.cloudflareinsights.com" in html:
              raise SystemExit("External Cloudflare asset reference remains in index.html")
          print("Local dependency audit passed")
          PY
      - name: Commit final build
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize local asset build"
          git push
